spring:
  datasource:
    # In Docker internal networking, PostgreSQL runs on internal port 5432
    url: jdbc:postgresql://postgres-tracker:5432/applicationtracker
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  data:
    redis:
      host: redis
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  similarity:
    threshold: 75.0
  services:
    match-service-url: ${MATCH_SERVICE_URL:http://match-service:8083}